# Catches the two things that most reliably broke this repo before:
# a typecheck error slipping into main, and Prisma client drift after a
# schema tweak. Company library contract tests also cover pagination,
# saved-list scoping, and progress across pages without a live database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Company library regression checks
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:4000
        run: npm run build
